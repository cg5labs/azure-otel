services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=7d
    ports:
      - "127.0.0.1:8428:8428"
    restart: unless-stopped

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
    ports:
      - "127.0.0.1:9428:9428"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.34.0
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - victoria-metrics
      - victoria-logs
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "1000:1000"
    environment:
      OTEL_OIDC_AUDIENCE: ${OTEL_OIDC_AUDIENCE:?Run setenv.sh to populate OTEL_OIDC_AUDIENCE}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Set AZURE_TENANT_ID in .env}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID in .env}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?Set AZURE_CLIENT_SECRET in .env}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID in .env}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in .env}
      AZURE_EVENTHUB_CONNECTION_STRING: ${AZURE_EVENTHUB_CONNECTION_STRING:?Set AZURE_EVENTHUB_CONNECTION_STRING in .env}
      AZURE_EVENTHUB_CONSUMER_GROUP: ${AZURE_EVENTHUB_CONSUMER_GROUP:?Set AZURE_EVENTHUB_CONSUMER_GROUP in .env}
      AZURE_EVENTHUB_STORAGE_DIRECTORY: ${AZURE_EVENTHUB_STORAGE_DIRECTORY:-/var/lib/otelcol/storage-v2}
    group_add:
      - "${CERT_GID:?Set CERT_GID in .env}"
    volumes:
      - type: bind
        source: ./otel-collector.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/ca/ca.crt
        target: /certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server/server.crt
        target: /server-certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server/server.key
        target: /server-certs/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/otel-collector-checkpoints
        target: /var/lib/otelcol
        bind:
          create_host_path: false
    expose:
      - "4317"
      - "4318"
      - "13133"
    ports:
      - "${OTEL_GRPC_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${OTEL_GRPC_BIND_ADDRESS:-127.0.0.1}:4318:4318"
    depends_on:
      - victoria-metrics
      - victoria-logs
    restart: unless-stopped

volumes:
  adapter-buffer:
